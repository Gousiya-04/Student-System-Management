<!--To insert student data-->
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Insert Student</title>
</head>
<body>
  <header class="site-header"><div class="brand-mark">SM</div><div><p class="eyebrow">STUDENT RECORDS</p><h1>INSERT STUDENT</h1></div></header>
<nav class="main-nav" aria-label="Main navigation">
<a href="index.html">Home</a><a href="list.html">List Students</a><a href="listOne.html">List Required Student</a><a href="insert.html">Insert Student</a><a href="update.html">Update Student</a><a href="delete.html">Delete Student</a>
</nav>
<section class="hero"><img class="page-image" src="assests/add.jpg" alt="Illustration: Add a student"/><div class="hero-copy"><h2>Add a student</h2><p>Enter the details below to create a student record.</p></div></section>

<section class="form-card">
<div class="field-group"><label for="sno">Student Number</label><input type="number" id="sno" placeholder="Enter student number" required></div>
<div class="field-group"><label for="name">Student Name</label><input type="text" id="name" placeholder="Enter student name" required></div>
<div class="field-group"><label for="total">Total Marks</label><input type="number" id="total" placeholder="Enter total marks" required></div>
<button class="primary-button" onclick="saveStudent()">Save Student</button>
</section>

<br><br>

<button onclick="location.href='index.html'">Home Page</button>

<script>
function saveStudent()
{
let sno=document.getElementById("sno").value;
let name=document.getElementById("name").value;
let total=document.getElementById("total").value;

fetch("/students",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
sno:sno,
name:name,
total:total
})
})
.then(response=>response.text())
.then(message=>{
alert(message);
location.href="index.html";
});

}

</script>
</body>
</html>
